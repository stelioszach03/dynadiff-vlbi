[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynadiff-vlbi"
version = "0.1.0"
description = "Evaluation framework and score-based diffusion reference implementation for earned versus enforced measurement consistency in dynamic VLBI imaging."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Stylianos Georgios Zacharioudakis", email = "sdi2200243@di.uoa.gr" },
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scikit-image>=0.22",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/stelioszach03/dynadiff-vlbi"
Manuscript = "paper/manuscript.md"

[tool.pytest.ini_options]
# "." is required: tests/test_partial_dft_bound.py imports the top-level
# `theory` package, which lives at the repository root, not under src/.
pythonpath = ["src", "."]
testpaths = ["tests"]
