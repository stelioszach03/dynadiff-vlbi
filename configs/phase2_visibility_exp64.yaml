dataset:
  image_size: 64
  sequence_length: 8
  train_size: 128
  val_size: 32
  test_size: 32
  ring_width: 0.06
  hotspot_width: 0.07

sampling:
  coverage: 0.08
  missing_fraction: 0.12

model:
  model_type: visibility_conditioned
  base_channels: 24
  dropout: 0.15
  include_dirty_input: true
  visibility_representation: real_imag
  include_uv_coords: true
  include_mask_channel: true
  uncertainty_head: true

training:
  batch_size: 4
  learning_rate: 0.0006
  epochs: 6
  temporal_loss_weight: 0.15
  heteroscedastic_loss_weight: 0.25

evaluation:
  compare_reference_baseline: true
  save_comparison_csv: true
  reference_baseline_run_name: null

project:
  name: dynadiff-vlbi-phase2
