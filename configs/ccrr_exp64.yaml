project:
  name: dynadiff-vlbi-ccrr

dataset:
  image_size: 64
  sequence_length: 8
  train_size: 128
  val_size: 32
  test_size: 32
  ring_width: 0.06
  hotspot_width: 0.07

sampling:
  mode: station_tracks
  station_count: 14
  earth_rotation_degrees: 125.0
  station_jitter: 0.04
  coverage: 0.06
  missing_fraction: 0.10
  hermitian_symmetric: true
  include_dc: true

noise:
  noise_std: 0.03

model:
  model_type: ccrr
  base_channels: 24
  refinement_channels: 16
  dropout: 0.15
  include_dirty_input: true
  visibility_representation: real_imag
  include_uv_coords: true
  include_mask_channel: true
  include_observation_metadata: true
  uncertainty_head: true
  residual_scale: 0.18
  freeze_backbone: true
  dc_enabled: true
  dc_weight: 1.0
  dc_learnable: false

training:
  batch_size: 4
  learning_rate: 0.0006
  epochs: 6
  temporal_loss_weight: 0.15
  heteroscedastic_loss_weight: 0.10
  reconstruction_warmup_epochs: 2
  backbone_checkpoint: null
  visibility_loss_weight: 0.02
  closure_loss_weight: 0.03
  closure_max_triangles: 24

evaluation:
  compare_reference_baseline: true
  save_comparison_csv: true
  reference_baseline_run_name: null
  reference_visibility_run_name: null
  reference_residual_run_name: null

