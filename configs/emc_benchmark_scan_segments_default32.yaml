project:
  name: dynadiff-vlbi-emc-benchmark-scan-segments

sampling:
  mode: station_tracks
  station_count: 12
  earth_rotation_degrees: 110.0
  station_jitter: 0.04
  coverage: 0.08
  missing_fraction: 0.08
  hermitian_symmetric: true
  include_dc: true

noise:
  noise_std: 0.03

model:
  model_type: emc_ccrr
  base_channels: 16
  refinement_channels: 8
  dropout: 0.15
  include_dirty_input: true
  visibility_representation: real_imag
  include_uv_coords: true
  include_mask_channel: true
  include_observation_metadata: true
  uncertainty_head: true
  residual_scale: 0.20
  freeze_backbone: true
  dc_enabled: true
  dc_weight: 1.0
  dc_learnable: false

training:
  learning_rate: 0.0008
  epochs: 8
  temporal_loss_weight: 0.15
  heteroscedastic_loss_weight: 0.10
  reconstruction_warmup_epochs: 2
  backbone_checkpoint: null
  visibility_loss_weight: 0.02
  closure_loss_weight: 0.0
  target_visibility_loss_weight: 0.06
  target_closure_loss_weight: 0.0
  closure_max_triangles: 24

evaluation:
  compare_reference_baseline: true
  save_comparison_csv: true
  reference_baseline_run_name: null
  reference_visibility_run_name: null
  reference_residual_run_name: null
  reference_ccrr_run_name: null

holdout:
  enabled: true
  strategy: scan_segment_blocks
  support_fraction: 0.6
  train_support_fractions:
    - 0.8
    - 0.6
    - 0.4
    - 0.2
  eval_support_fractions:
    - 0.8
    - 0.6
    - 0.4
    - 0.2
  max_triangles: 24
  min_eval_closure_triangles: 24
