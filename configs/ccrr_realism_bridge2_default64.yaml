project:
  name: dynadiff-vlbi-ccrr-bridge2-default64

sampling:
  mode: station_tracks
  station_count: 14
  earth_rotation_degrees: 135.0
  station_jitter: 0.05
  coverage: 0.07
  missing_fraction: 0.12
  hermitian_symmetric: true
  include_dc: true
  scan_gap_probability: 0.18
  scan_gap_length: 1

noise:
  noise_std: 0.04
  baseline_noise_jitter: 0.35
  gain_amplitude_std: 0.08
  gain_phase_std: 0.18

model:
  model_type: ccrr
  base_channels: 24
  refinement_channels: 16
  dropout: 0.15
  include_dirty_input: true
  visibility_representation: real_imag
  include_uv_coords: true
  include_mask_channel: true
  include_observation_metadata: true
  uncertainty_head: true
  residual_scale: 0.18
  freeze_backbone: true
  dc_enabled: true
  dc_weight: 1.0
  dc_learnable: false

training:
  learning_rate: 0.0008
  epochs: 8
  temporal_loss_weight: 0.15
  heteroscedastic_loss_weight: 0.10
  reconstruction_warmup_epochs: 2
  backbone_checkpoint: null
  visibility_loss_weight: 0.03
  closure_loss_weight: 0.04
  closure_max_triangles: 24

evaluation:
  compare_reference_baseline: true
  save_comparison_csv: true
  reference_baseline_run_name: null
  reference_visibility_run_name: null
  reference_residual_run_name: null
